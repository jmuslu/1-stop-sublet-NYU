name: Deploy static site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  # write, not read: the build commits the accumulated listings back so the
  # aggregate survives between scheduled runs.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # scrapers/run.py merges each scrape into the stored listings rather than
      # replacing them, but that only compounds if the file survives the run.
      # Without this step every scheduled build restarts from whatever was last
      # committed by hand, and the aggregate can never grow past one window.
      # Pushes made with GITHUB_TOKEN do not re-trigger workflows, so this
      # cannot loop.
      - name: Persist accumulated listings
        run: |
          if [ -z "$(git status --porcelain src/data/generatedListings.json)" ]; then
            echo "No listing changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generatedListings.json
          git commit -m "Update aggregated listings [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: project/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
